name: Deploy KU94 RUN to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - data/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows:
      - Update running challenge data
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out site files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          if [ -d data ]; then
            cp -R data/. _site/data/
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > _site/published-at.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
